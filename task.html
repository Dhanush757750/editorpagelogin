
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    padding: 85px 15px 35px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: linear-gradient(-45deg, #667eea, #764ba2, #a18cd1, #6a5acd);
    background-size: 400% 400%;
    animation: gradientMove 12s ease infinite;
    color: #292344;
}

@keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* Added: Live date and time */
.datetime-box {
    position: fixed;
    top: 20px;
    right: 20px;
    min-width: 210px;
    padding: 12px 16px;
    background: rgba(255, 255, 255, 0.17);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    text-align: right;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    backdrop-filter: blur(10px);
    z-index: 1000;
}

.datetime-day {
    font-size: 13px;
    font-weight: bold;
}

.datetime-date {
    margin-top: 5px;
    font-size: 12px;
}

.datetime-time {
    margin-top: 6px;
    font-size: 21px;
    font-weight: bold;
    letter-spacing: 1px;
    font-variant-numeric: tabular-nums;
}

/* Back to Menu Button */
.back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 20px;
    color: white;
    background: linear-gradient(135deg, #55369b, #8b5bd3);
    border: 1px solid rgba(255,255,255,0.4);
    border-radius: 12px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 5px 16px rgba(35,15,80,0.25);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    z-index: 1000;
}

.back-btn:hover {
    transform: translateY(-3px) scale(1.04);
    box-shadow: 0 9px 22px rgba(35,15,80,0.35);
}

.back-btn:active {
    transform: scale(0.96);
}

.tasks-card {
    width: 100%;
    max-width: 650px;
    padding: 28px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(255,255,255,0.7);
    border-radius: 22px;
    box-shadow: 0 20px 55px rgba(35, 15, 80, 0.25);
    animation: slideIn 0.7s ease both;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(25px) scale(0.98);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
}

.header h1 {
    font-size: 28px;
    color: #55369b;
}

.task-count {
    padding: 8px 12px;
    background: #eee7ff;
    color: #663bb2;
    border-radius: 20px;
    font-size: 13px;
    font-weight: bold;
    white-space: nowrap;
}

.subtitle {
    color: #89839c;
    font-size: 14px;
    margin-bottom: 23px;
}

.progress-area {
    margin-bottom: 22px;
}

.progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #706987;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 9px;
    background: #eeeaf7;
    border-radius: 20px;
    overflow: hidden;
}

.progress-fill {
    width: 0%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #667eea, #9b59d0);
    transition: width 0.45s ease;
}

.add-task {
    display: flex;
    gap: 10px;
    margin-bottom: 18px;
}

.add-task input {
    flex: 1;
    min-width: 0;
    padding: 13px 14px;
    border: 1px solid #e0d9f1;
    border-radius: 11px;
    outline: none;
    font-size: 14px;
    transition: border 0.25s, box-shadow 0.25s;
}

.add-task input:focus {
    border-color: #8b5bd3;
    box-shadow: 0 0 0 4px rgba(139, 91, 211, 0.12);
}

button {
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: transform 0.25s, box-shadow 0.25s, background 0.25s;
}

.add-btn {
    padding: 12px 20px;
    color: white;
    border-radius: 11px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    box-shadow: 0 5px 14px rgba(102, 80, 190, 0.25);
}

.add-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 9px 20px rgba(102, 80, 190, 0.35);
}

.add-btn:active,
.action-btn:active {
    transform: scale(0.96);
}

.task-toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.task-toolbar h2 {
    font-size: 17px;
    color: #44336f;
}

.clear-btn {
    background: #f4efff;
    color: #7546b8;
    padding: 9px 12px;
    border-radius: 9px;
    font-size: 12px;
}

.clear-btn:hover {
    background: #e8dcff;
    transform: translateY(-2px);
}

.task-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px;
    background: #faf8ff;
    border: 1px solid #eee8fa;
    border-radius: 12px;
    animation: taskAppear 0.35s ease both;
    transition: transform 0.25s, box-shadow 0.25s, border 0.25s;
}

@keyframes taskAppear {
    from {
        opacity: 0;
        transform: translateX(-12px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

.task:hover {
    transform: translateY(-2px);
    border-color: #d9c8fa;
    box-shadow: 0 7px 18px rgba(80, 48, 130, 0.08);
}

.task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: #8054c7;
    cursor: pointer;
}

.task-label {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
    overflow-wrap: anywhere;
}

.task.completed .task-label {
    text-decoration: line-through;
    color: #aaa3ba;
}

.delete-btn {
    padding: 7px 10px;
    background: #fff0f2;
    color: #cf526b;
    border-radius: 8px;
    font-size: 12px;
}

.delete-btn:hover {
    background: #ffdce3;
    transform: scale(1.05);
}

.empty-state {
    text-align: center;
    padding: 35px 10px;
    color: #938ba8;
    background: #faf8ff;
    border: 1px dashed #dcd1f0;
    border-radius: 12px;
    line-height: 1.8;
    font-size: 14px;
}

.footer {
    margin-top: 20px;
    text-align: center;
    color: #9991ad;
    font-size: 12px;
}

@media (max-width: 480px) {
    body {
        padding: 78px 10px 18px;
    }

    .back-btn {
        top: 12px;
        left: 10px;
        padding: 10px 14px;
        font-size: 13px;
    }

    .tasks-card {
        padding: 19px 14px;
        border-radius: 17px;
    }

    .header h1 {
        font-size: 23px;
    }

    .add-task {
        flex-wrap: wrap;
    }

    .add-task input {
        width: 100%;
        flex-basis: 100%;
    }

    .add-btn {
        width: 100%;
    }

    .task {
        padding: 12px 10px;
        gap: 9px;
    }

    /* Added: Date and time on small screens */
    .datetime-box {
        top: 12px;
        right: 10px;
        min-width: 175px;
        padding: 8px 10px;
    }

    .datetime-day { font-size: 11px; }
    .datetime-date { font-size: 10px; }
    .datetime-time { font-size: 16px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
    }
}
</style>
</head>

<body>

<!-- Added: Live Date and Time -->
<div class="datetime-box">
    <div class="datetime-day" id="liveDay">Loading day...</div>
    <div class="datetime-date" id="liveDate">Loading date...</div>
    <div class="datetime-time" id="liveTime">Loading time...</div>
</div>

<!-- Back to Menu Button -->
<button type="button" class="back-btn" onclick="goToMenu()">
    <span aria-hidden="true">←</span>
    Back
</button>

<main class="tasks-card">
    <div class="header">
        <h1>My Tasks</h1>
        <span class="task-count" id="taskCount">0 tasks</span>
    </div>

    <p class="subtitle">Stay focused, finish your tasks, and make progress every day.</p>

    <div class="progress-area">
        <div class="progress-label">
            <span>Daily progress</span>
            <strong id="progressText">0% completed</strong>
        </div>
        <div class="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <form class="add-task" id="addTaskForm">
        <input
            type="text"
            id="newTask"
            placeholder="Enter a new task..."
            maxlength="200"
            required
        >
        <button type="submit" class="add-btn">+ Add Task</button>
    </form>

    <div class="task-toolbar">
        <h2>Your to-do list</h2>
        <button type="button" class="clear-btn action-btn" id="clearCompleted">
            Clear completed
        </button>
    </div>

    <div class="task-list" id="taskList"></div>

    <div class="footer">One task at a time. Keep moving forward!</div>
</main>

<script>
const STORAGE_KEY = "purpleMyTasksList";

const defaultTasks = [
    {
        id: 1,
        text: "Complete DBMS assignment",
        completed: false
    },
    {
        id: 2,
        text: "Study for CIA exam",
        completed: false
    },
    {
        id: 3,
        text: "Work on project report",
        completed: false
    }
];

let tasks = [];

try {
    const savedTasks = localStorage.getItem(STORAGE_KEY);
    tasks = savedTasks === null
        ? defaultTasks
        : JSON.parse(savedTasks);

    if (!Array.isArray(tasks)) {
        tasks = defaultTasks;
    }
} catch (error) {
    tasks = defaultTasks;
}

const taskList = document.getElementById("taskList");
const taskCount = document.getElementById("taskCount");
const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");
const addTaskForm = document.getElementById("addTaskForm");
const newTaskInput = document.getElementById("newTask");

/* Added: Update live date and time every second */
function updateDateTime() {
    const now = new Date();

    document.getElementById("liveDay").textContent =
        now.toLocaleDateString("en-IN", {
            weekday: "long"
        });

    document.getElementById("liveDate").textContent =
        now.toLocaleDateString("en-IN", {
            day: "2-digit",
            month: "long",
            year: "numeric"
        });

    document.getElementById("liveTime").textContent =
        now.toLocaleTimeString("en-IN", {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hour12: true
        });
}

updateDateTime();
setInterval(updateDateTime, 1000);

/* Redirect to the menu page */
function goToMenu() {
    window.location.href = "dashboard_mobile_same_laptop_view.html";
}

function saveTasks() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (error) {
        alert("Unable to save tasks in this browser.");
    }
}

function renderTasks() {
    taskList.innerHTML = "";

    if (tasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-state";
        empty.textContent = "✨ No tasks yet. Add your first task above!";
        taskList.appendChild(empty);
    }

    tasks.forEach(task => {
        const row = document.createElement("div");
        row.className = "task" + (task.completed ? " completed" : "");

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.completed;
        checkbox.setAttribute("aria-label", "Mark task complete");

        checkbox.addEventListener("change", () => {
            task.completed = checkbox.checked;
            saveTasks();
            renderTasks();
        });

        const label = document.createElement("span");
        label.className = "task-label";
        label.textContent = task.text;

        const deleteButton = document.createElement("button");
        deleteButton.className = "delete-btn action-btn";
        deleteButton.type = "button";
        deleteButton.textContent = "Delete";

        deleteButton.addEventListener("click", () => {
            tasks = tasks.filter(item => item.id !== task.id);
            saveTasks();
            renderTasks();
        });

        row.append(checkbox, label, deleteButton);
        taskList.appendChild(row);
    });

    const completed = tasks.filter(task => task.completed).length;
    const total = tasks.length;
    const percentage = total
        ? Math.round(completed / total * 100)
        : 0;

    taskCount.textContent = `${total} ${total === 1 ? "task" : "tasks"}`;
    progressText.textContent = `${percentage}% completed`;
    progressFill.style.width = `${percentage}%`;
}

addTaskForm.addEventListener("submit", event => {
    event.preventDefault();

    const text = newTaskInput.value.trim();
    if (!text) return;

    tasks.push({
        id: Date.now() + Math.random(),
        text,
        completed: false
    });

    saveTasks();
    renderTasks();
    newTaskInput.value = "";
    newTaskInput.focus();
});

document.getElementById("clearCompleted").addEventListener("click", () => {
    const completedCount = tasks.filter(task => task.completed).length;

    if (completedCount === 0) {
        alert("There are no completed tasks to clear.");
        return;
    }

    if (confirm(`Delete ${completedCount} completed task(s)?`)) {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        renderTasks();
    }
});

renderTasks();
</script>

</body>
</html>
